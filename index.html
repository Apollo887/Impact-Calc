<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Force Calculator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }
        .container {
            background: white;
            padding: 30px;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        button {
            width : 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }#result {
            margin-top: 20px;
            font-size: 1.2em;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Impact Force Calculator</h2>
        <label for="mass">Mass (kg):</label>
        <input type="number" id="mass" placeholder="Enter mass in kg">
        
        <label for="velocity">Velocity (m/s):</label>
        <input type="number" id="velocity" placeholder="Enter velocity in m/s">
        
        <label for="time">Time of impact (s):</label>
        <input type="number" id="time" placeholder="Enter time of impact in seconds">
        
        <button onclick="calculateImpactForce()">Calculate Impact Force</button>
        
        <div id="result"></div>
    </div>

    <script>
        function calculateImpactForce() {
            const mass = parseFloat(document.getElementById('mass').value);
            const velocity = parseFloat(document.getElementById('velocity').value);
            const time = parseFloat(document.getElementById('time').value);

            if (isNaN(mass) || isNaN(velocity) || isNaN(time) || time <= 0) {
                document.getElementById('result').textContent = 'Please enter valid inputs.';
                return;
            }

            const force = (mass * velocity) / time;
            document.getElementById('result').textContent = `Impact Force: ${force.toFixed(2)} N`;
        }
    </script>
</body>
</html>
